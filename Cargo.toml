[workspace]
members = [
    ".",
    "crates/struct-view-build-info",
    "crates/struct-view-cli",
    "crates/struct-view-core",
    "crates/struct-view-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
arboard = "3"
eframe = { version = "0.36", default-features = false }
egui = "0.36"
json5 = "1"
rfd = "0.17"
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
vergen = { version = "10", features = ["build", "cargo", "rustc"] }

[package]
name = "struct_view"
version.workspace = true
edition.workspace = true
description = "A fast, cross-platform structured data explorer and editor for JSON, YAML, TOML, and JSON5"

[[bin]]
name = "struct_view"
path = "src/main.rs"

[dependencies]
struct-view-build-info = { path = "crates/struct-view-build-info" }
struct-view-cli = { path = "crates/struct-view-cli" }
struct-view-core = { path = "crates/struct-view-core" }
struct-view-ui = { path = "crates/struct-view-ui" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
