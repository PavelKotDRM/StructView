[package]
name = "json_viewer"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform desktop JSON viewer"

[[bin]]
name = "json_viewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", features = ["default"] }
egui = "0.35"
serde_json = "1"
rfd = "0.17"
arboard = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
