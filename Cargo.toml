[package]
name = "json_viewer"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform desktop viewer for JSON, YAML, TOML, and JSON5"
build = "build.rs"

[[bin]]
name = "json_viewer"
path = "src/main.rs"

[dependencies]
egui = "0.36"
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1"
json5 = "1"
rfd = "0.17"
arboard = "3"

[build-dependencies]
vergen = { version = "10", features = ["build", "cargo", "rustc"] }

# Нативный буфер обмена Wayland (без него на Wayland требуется XWayland).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
] }

[target.'cfg(not(windows))'.dependencies]
eframe = "0.36"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
