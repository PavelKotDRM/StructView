[package]
name = "json_viewer"
version = "0.1.0"
edition = "2024"
description = "A fast, cross-platform desktop JSON viewer"

[[bin]]
name = "json_viewer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.35", features = ["default"] }
egui = "0.35"
serde_json = "1"
rfd = "0.17"
arboard = "3"

# Нативный буфер обмена Wayland (без него на Wayland требуется XWayland).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
