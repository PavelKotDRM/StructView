[package]
name = "struct-view-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native graphical interface for StructView"

[dependencies]
arboard.workspace = true
csscolorparser.workspace = true
egui.workspace = true
rfd.workspace = true
resvg = "0.48"
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
struct-view-routing.workspace = true
struct-view-animation-api.workspace = true
struct-view-operations.workspace = true
struct-view-build-info = { path = "../struct-view-build-info" }
struct-view-core = { path = "../struct-view-core" }

[dev-dependencies]
# Tests build `scroll_area::State` with a preset offset, which is only possible via serde since egui 0.37.
egui = { workspace = true, features = ["serde"] }
tempfile.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Native clipboard support without XWayland on Wayland.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
arboard = { workspace = true, features = ["wayland-data-control"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
eframe = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
] }

[target.'cfg(not(windows))'.dependencies]
xcap = "0.9.8"
eframe = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wgpu",
    "x11",
    "wayland",
] }
